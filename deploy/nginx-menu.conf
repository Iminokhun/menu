# Блок для уже работающего nginx (другого проекта на этом сервере):
# пересылает домен меню на контейнер menu. Вместо Caddy, когда 80/443 заняты.
# Заменить: menu.example.kg — домен меню; пути сертификатов — как у nginx
# того проекта; адрес в proxy_pass — см. deploy/README.md, раздел 1.

server {
    listen 80;
    server_name menu.example.kg www.menu.example.kg;
    # Проверка домена для выдачи сертификата (certbot --webroot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://menu.example.kg$request_uri; }
}

server {
    # Так понимают и старые nginx; в новых (1.25+) — предупреждение, не ошибка
    listen 443 ssl http2;
    server_name menu.example.kg;

    ssl_certificate     /etc/letsencrypt/live/menu.example.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menu.example.kg/privkey.pem;

    # Больше 3D-модели (25 МБ) серверу присылать нечего
    client_max_body_size 30m;

    # Только HTTPS — браузер сам не пойдёт по незащищённому адресу
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Сжатие меню и данных. 3D-модели уже сжаты сервером (Content-Encoding:
    # gzip) — nginx такие ответы повторно не сжимает
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/wasm;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузка 3D-модели по медленной связи может идти минуты
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
