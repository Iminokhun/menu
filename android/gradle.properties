# Машина: 12 ГБ RAM, 4 ядра. Было -Xmx8G -XX:MaxMetaspaceSize=4G — демон
# просил всю физическую память, сборка уходила в своп и не заканчивалась.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

android.useAndroidX=true

# Параллельная сборка плодит воркеры-JVM; при такой памяти это вредит.
org.gradle.parallel=false
org.gradle.workers.max=2

# Build cache намеренно НЕ включаем: он однажды закэшировал успешную
# компиляцию Kotlin с пустым выходом и восстанавливал её при каждой сборке.
