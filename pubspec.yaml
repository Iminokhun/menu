name: cafe_andalus_menu
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.6

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # HTTP-клиент для своего API-сервера
  http: ^1.2.0
  # Изображения с кэшированием
  cached_network_image: ^3.3.1
  # Её же: как фото загружается в браузере (ImageRenderMethodForWeb)
  cached_network_image_platform_interface: ^4.1.1
  # Её же кэш на диске: фото меню скачиваются заранее
  flutter_cache_manager: ^3.4.1
  # Генерация QR-кода
  qr_flutter: ^4.1.0
  # Шрифты
  google_fonts: ^6.1.0
  # Локализация
  intl: any
  file_picker: ^12.0.0
  # Выбранный филиал запоминается на устройстве: один APK на оба зала
  shared_preferences: ^2.3.0
  printing: ^5.15.1
  pdf: ^3.13.1
  model_viewer_plus: ^1.10.0
  web: ^1.1.1
  # «Живое фото» блюда: страница на Three.js внутри приложения
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Шрифт для PDF с QR-кодом: лежит в приложении, чтобы печать
    # работала и без интернета (лицензия OFL)
    - assets/fonts/Manrope-Regular.ttf
    - assets/fonts/Manrope-Bold.ttf
    # «Живое фото» блюда: страница и Three.js (MIT), без интернета
    - assets/live_photo/
    # Фон тем «Тёмная» и «Светлая» — в приложении, без интернета
    - assets/backgrounds/

# Иконка приложения на телефоне и планшете — знак menu.kg.
# После замены картинок в assets/icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  # Старые Android: квадрат целиком
  image_path: assets/icon/icon.png
  # Android 8+: знак с полями поверх фона, телефон сам режет до своей формы
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_background: "#1E1E1E"
  # Поля уже в самой картинке: знак — 60% её стороны, видна середина 2/3
  adaptive_icon_foreground_inset: 0
  # Сайт: значок вкладки и иконка «на главный экран»
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#1E1E1E"
    theme_color: "#1E1E1E"
