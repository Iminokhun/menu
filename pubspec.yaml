name: cafe_andalus_menu
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.6

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Supabase
  supabase_flutter: ^2.9.0
  # Изображения с кэшированием
  cached_network_image: ^3.3.1
  # Генерация QR-кода
  qr_flutter: ^4.1.0
  # Шрифты
  google_fonts: ^6.1.0
  # Локализация
  intl: any
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/translations.json
